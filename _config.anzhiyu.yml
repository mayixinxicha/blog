# 站点级 Anzhiyu 主题配置（覆盖主题默认值）
# 文档：https://anzhiyu.cn/

# 站点头像（先用主题默认占位图，之后可换成自己的照片地址）
avatar: https://npm.elemecdn.com/anzhiyu-blog-static@1.0.4/img/avatar.jpg

# 顶部导航菜单
menu:
  虚拟卡: /card/ || anzhiyu-icon-qrcode
  eSIM: /esim/ || anzhiyu-icon-radio
  海外ID: /overseas-id/ || anzhiyu-icon-language
  AI订阅: /ai-subscription/ || anzhiyu-icon-bolt
  工具箱: /toolbox/ || anzhiyu-icon-gear
  免费清单: /free-list/ || anzhiyu-icon-list-ul

# 主页打字机 Slogan
subtitle:
  enable: true
  effect: true
  startDelay: 300
  typeSpeed: 150
  backSpeed: 50
  loop: true
  source: false
  sub:
    - 卡、号、AI订阅，一站式配齐

# 首页顶部标题区（问候卡 + 三彩色卡片）
home_top:
  enable: true
  timemode: date
  title: 卡、号、AI订阅
  subTitle: 一站式配齐
  siteText: xiexiaoer.net
  category:
    - name: 开卡
      path: /card/
      shadow: var(--anzhiyu-shadow-blue)
      class: blue
      icon: anzhiyu-icon-qrcode
    - name: 办号
      path: /esim/
      shadow: var(--anzhiyu-shadow-red)
      class: red
      icon: anzhiyu-icon-radio
    - name: 订AI
      path: /ai-subscription/
      shadow: var(--anzhiyu-shadow-green)
      class: green
      icon: anzhiyu-icon-bolt

# 页脚
footer:
  owner:
    enable: true
    since: 2026

# 自定义注入脚本（导航页面名优化 + 菜单徽章 + 三卡片小字 + 图标墙动效）
inject:
  bottom:
    - <script src="/js/custom.js"></script>
