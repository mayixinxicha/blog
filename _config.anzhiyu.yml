# 站点级 Anzhiyu 主题配置（覆盖主题默认值）
# 文档：https://anzhiyu.cn/

# 站点头像（店小二形象，用于加载页/侧边栏/评论区）
avatar:
  img: /img/avatar.jpg

# 开屏加载动画已关闭（2026-11-13）：站点轻量秒开，全屏遮罩反成纯等待，拖慢 LCP
preloader:
  enable: false
  avatar: /img/avatar.jpg

# 网站图标（标签页 favicon，极简橙色笑脸）
favicon: /img/favicon.png

# 标签卖萌（离开/回来变标题）：业务站关闭
diytitle:
  enable: false

# 本地搜索（右上角放大镜）
local_search:
  enable: true
  preload: true

# 分类/标签页文章列表样式：index = 与首页相同的卡片流（默认横条列表）
category_ui: index

# 分类/标签/归档等无独立头图页面的默认横幅（深蓝渐变，白色页面标题压在其上）
default_top_img: /img/cat-banner.svg

# 文章版权信息：location 置空去掉主题作者默认的"长沙"属地角标
post_copyright:
  enable: true
  decode: false
  author_href: null
  location: ''
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/
  avatarSinks: false
  copyright_author_img_back: null
  copyright_author_img_front: null
  copyright_author_link: /

# 关闭首页问候卡的"小人剪影"canvas 动画（与标签云互斥；开启它就不会显示标题和图标流动）
peoplecanvas:
  enable: false

# 站点名字体：与正文统一（原主题栈在 Windows 上落到正黑体导致和菜单不一致；保留苹方给 Mac 访客）
blog_title_font:
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Lato, Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif

# 顶部导航菜单
menu:
  虚拟卡: /card/ || anzhiyu-icon-qrcode
  eSIM: /esim/ || anzhiyu-icon-radio
  Apple ID: /apple-id/ || anzhiyu-icon-language
  AI订阅: /ai-subscription/ || anzhiyu-icon-bolt
  工具箱: /toolbox/ || anzhiyu-icon-gear
  清单: /free-list/ || anzhiyu-icon-list-ul

# 主页打字机 Slogan
subtitle:
  enable: true
  effect: true
  startDelay: 300
  typeSpeed: 150
  backSpeed: 50
  loop: true
  source: false
  sub:
    - 卡、号、AI订阅，一站式配齐

# 首页顶部标题区（问候卡 + 三彩色卡片）
home_top:
  enable: true
  timemode: date
  title: 卡、号、AI订阅
  subTitle: 一站式配齐
  siteText: xiexiaoer.net
  category:
    - name: 开卡
      path: /card/
      shadow: var(--anzhiyu-shadow-blue)
      class: blue
      icon: anzhiyu-icon-qrcode
    - name: 办号
      path: /esim/
      shadow: var(--anzhiyu-shadow-red)
      class: red
      icon: anzhiyu-icon-radio
    - name: 订AI
      path: /ai-subscription/
      shadow: var(--anzhiyu-shadow-green)
      class: green
      icon: anzhiyu-icon-bolt
  # 右侧大卡：换成自家小店推广（原为主题作者的广告位）
  # tips 置空：两行结构（标题+小字），品牌行信息已合并进小字，模板行由 custom.js 移除
  banner:
    tips: ""
    title: AI账号 · 会员，进店直接挑
    image: /img/favicon.png
    link: https://shop.xiaomimiai.com/

# 侧边栏作者卡（补齐原主题的文字区：欢迎光临胶囊由 custom.js 固定）
author_status:
  enable: true

aside:
  card_author:
    enable: true
    description: '<div style="line-height:1.38;margin:0.6rem 0;text-align:justify;color:rgba(255,255,255,0.8);">这有关于<b style="color:#fff">开卡、办号、订AI</b>相关的工具和方法，还有现成的各类<b style="color:#fff">AI账号和会员</b>。</div><div style="line-height:1.38;margin:0.6rem 0;text-align:justify;color:rgba(255,255,255,0.8);">相信你可以在这里找到对你有用的<b style="color:#fff">知识</b>和<b style="color:#fff">教程</b>。</div>'
    name_link: /

# 社交链接（作者卡底部名称区的渲染开关，必须配置才会显示名称+副标题）
social:
  AI小店: https://shop.xiaomimiai.com || anzhiyu-icon-qrcode
  工具箱: /toolbox/ || anzhiyu-icon-gear

# 打赏：业务站关闭（原位置由 custom.js 注入「分享」按钮；同时隐藏打赏弹窗和控制台打赏区）
reward:
  enable: false

# 页脚
footer:
  owner:
    enable: true
    since: 2026
  # 清空底部"主题"外链（去掉原作者引流）
  footerBar:
    linkList: []

# 自定义注入脚本（导航页面名优化 + 菜单徽章 + 三卡片小字 + 图标墙动效）
inject:
  bottom:
    - <script src="/js/custom.js"></script>
